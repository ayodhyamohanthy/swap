# SeatSwap — keyless Cloudflare deploy (no secrets needed to ship the PWA).
# The PWA builds + serves with ZERO keys: Supabase / Razorpay / PayPal /
# VAPID / PostHog / Sentry are all optional at build time (local-first
# fallbacks) and become live when env/secrets land. See docs/12 §8.
name = "seatswap"
compatibility_date = "2026-09-01"
# server/jobs.ts, server/payments-helpers.ts and lib/supabase.ts use
# node:crypto, Buffer and process.env. Without this flag the Worker bundle
# builds but those imports throw at runtime on the first webhook.
compatibility_flags = ["nodejs_compat"]
# The server half of the app. Until this line existed, every build produced
# dist/server/server.js (23 server functions + all the payment logic) and
# deployed only dist/cf, so nothing could ever POST to /api/public/webhooks/*
# — see app/src/worker.ts for what the entry does and what it refuses to do.
main = "./src/worker.ts"

[assets]
# Required once a Worker exists: the Worker is now asked first and hands back
# every non-/api/public request, so it needs the asset binding to answer them.
binding = "ASSETS"
# `dist/cf` is dist/client minus `_redirects`, staged by scripts/postbuild.mjs.
# Workers Static Assets reads `_redirects` itself and rejects the Netlify/Surge
# catch-all `/* /index.html 200` as an infinite loop (API error 100324: it
# normalises the destination to `/`, which re-matches its own splat), so the
# first deploy was refused outright. Cloudflare needs no catch-all rule —
# `not_found_handling` below IS its SPA fallback — and there is no wrangler
# escape hatch for the file: `[assets] exclude` is not a supported key
# (wrangler 4.143 answers "Unexpected fields found in assets field").
# `_headers`, which Cloudflare also reads, is kept in the staged copy.
directory = "./dist/cf"
not_found_handling = "single-page-application"

# Custom domain: toyoufromme.website — NOT attachable to this worker yet.
# Measured 2026-09-29 (L1, answering L9's requests): the zone does NOT sit
# on Cloudflare — NS is dns{1,2}.registrar-servers.com (NameCheap default) —
# so uncommenting `routes` below fails with "zone not found". Two more
# findings from the same pass: legacy GitHub Pages held the domain and
# published the REPO ROOT on every push (ungated red trees shipped, and
# /docs/** including the lane board was publicly readable), and GitHub
# Actions' ubuntu-latest jobs are billing-blocked (green: failure in 4-9s,
# never started), which rules out a gated workflow replacement for Pages.
# Therefore: the Pages site was DELETED (gh api -X DELETE .../pages,
# 2026-09-29) — the domain now answers "no site" instead of the prototype,
# and the real app serves at https://seatswap.ayodhya-711.workers.dev/.
# HUMAN STEP (filed to Ayu): move the zone's NS to Cloudflare, then
# uncomment the routes line and `wrangler deploy`.
# routes = [{ pattern = "toyoufromme.website/*", zone_name = "toyoufromme.website" }]

[vars]
# Public, safe to ship: no secret here.
# VITE_SUPABASE_URL = "https://xyzcompany.supabase.co"
# VITE_SUPABASE_ANON_KEY = "eyJ..."
# VITE_VAPID_PUBLIC_KEY = "B..."

# PostHog (docs/12 §7 — the ONE analytics backend). NOT a secret: browser
# capture posts to a public, write-only ingest endpoint with a project token
# (`phc_…`), which is the same class of value as the Supabase anon key above.
# It goes here as a public var, not in the secrets block below — and the
# difference matters: `lib/posthog.ts` reads it from the BROWSER bundle via
# `import.meta.env.VITE_POSTHOG_KEY`, so a `wrangler secret` of the same name
# would never reach the code that needs it. Until this is set, forwarding is
# inert by design (`posthogKey()` is '' and nothing is queued or sent).
# The traveller also has to opt in: Settings → Share anonymous usage data.
# VITE_POSTHOG_KEY = "phc_..."
# VITE_POSTHOG_HOST = "https://us.i.posthog.com"  # EU/self-hosted only

# Secrets (wrangler secret put — never in this file):
# RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET / RAZORPAY_WEBHOOK_SECRET
# PAYPAL_CLIENT_ID / PAYPAL_CLIENT_SECRET / PAYPAL_WEBHOOK_ID
# VAPID_PRIVATE_KEY
# SENTRY_DSN
#
# `POSTHOG_KEY` is deliberately NOT here. It was listed in this block before
# the forwarder existed, which read as "put this secret in and analytics start";
# the forwarder instead needs the public VITE_ var above. A server-side proxy
# (which would want a secret) was considered and not built: this deploy is
# static assets with no worker entry, and a proxy is not needed for a
# write-only public token.

# Cron for app/src/server/jobs.ts (enable when secrets land):
# [[triggers.crons]] crons = ["*/15 * * * *"]
