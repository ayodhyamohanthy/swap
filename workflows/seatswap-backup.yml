# Copy to: .github/workflows/seatswap-backup.yml in the swap repo.
# Nightly pg_dump of seatswap-prod -> gzip -> Cloudflare R2 (S3 API).
# Secrets required (repo Settings -> Secrets and variables -> Actions):
#   SUPABASE_DB_URL       - direct connection string (port 5432), backups only
#   R2_ACCESS_KEY_ID      - R2 API token scoped to seatswap-backups-prod
#   R2_SECRET_ACCESS_KEY  - same token
#   R2_ENDPOINT           - https://<account-id>.r2.cloudflarestorage.com
#   ZEPTOMAIL_TOKEN       - Zoho ZeptoMail send token
#   ALERT_EMAIL           - ops inbox for failure alerts
# Retention: 30 days via R2 lifecycle rule (set once in CF dashboard).

name: seatswap-backup-prod

on:
  schedule:
    - cron: "0 22 * * *" # 22:00 UTC = 03:30 IST
  workflow_dispatch: {} # allow manual run for the quarterly restore drill

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install postgres client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          STAMP=$(date -u +%F)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          pg_dump "$DATABASE_URL" --no-owner --no-privileges \
            | gzip > "seatswap-$STAMP.sql.gz"
          # refuse to upload an empty/failed dump
          test "$(stat -c%s "seatswap-$STAMP.sql.gz")" -gt 1024

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp "seatswap-$STAMP.sql.gz" \
            "s3://seatswap-backups-prod/seatswap-$STAMP.sql.gz" \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}"

      - name: Verify upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3api head-object \
            --bucket seatswap-backups-prod \
            --key "seatswap-$STAMP.sql.gz" \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}"

      - name: Alert on failure (ZeptoMail)
        if: failure()
        env:
          ZEPTOMAIL_TOKEN: ${{ secrets.ZEPTOMAIL_TOKEN }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          curl -s -X POST "https://api.zeptomail.in/v1.1/email" \
            -H "Authorization: $ZEPTOMAIL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"from\": {\"address\": \"alerts@seatswap.example\"},
              \"to\": [{\"email_address\": {\"address\": \"$ALERT_EMAIL\"}}],
              \"subject\": \"[seatswap] nightly backup FAILED $STAMP\",
              \"textbody\": \"pg_dump -> R2 failed. Check the Actions run. Backups older than 30d are auto-deleted; do not let this sit.\"
            }" || true



