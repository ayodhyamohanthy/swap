<script>
(function () {
  function toast(m) {
    var t = document.getElementById('toast');
    t.textContent = m; t.hidden = false;
    clearTimeout(t._h); t._h = setTimeout(function () { t.hidden = true; }, 2600);
  }
  window.toast = toast;
  var inFrame = false;
  try { inFrame = window.self !== window.top; } catch (e) { inFrame = true; }
  var qs = new URLSearchParams(location.search);
  var swOff = qs.get('sw') === 'off';
  var isDev = /localhost|^127\.|^192\.168\.|^10\./.test(location.hostname);
  SeatSwapApp.boot();
  if ('serviceWorker' in navigator && !swOff && !isDev && !inFrame && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
})();
</script>
